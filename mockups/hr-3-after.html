<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;}
  body{
    width:1440px;height:900px;overflow:hidden;background:#fff;
    font-family:-apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  .stage{position:relative;width:1440px;height:900px;overflow:hidden;background:#fff;}
  .bg{position:absolute;top:0;left:0;width:1440px;height:900px;display:block;}

  .cover{
    position:absolute;
    left:40px;top:566px;width:580px;height:174px;
    background:#f2f6fd;
    display:flex;
    flex-direction:column;
    gap:11px;
  }

  .cta-btn{
    width:420px;
    height:64px;
    border-radius:4px;
    background:#0056d2;
    color:#ffffff;
    font-size:17px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    line-height:1.25;
    padding:0 20px;
    box-sizing:border-box;
  }

  .perks{
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .perk{
    font-size:15px;
    line-height:1.4;
    color:#1f1f1f;
    display:flex;
    align-items:flex-start;
  }
  .perk .check{
    color:#0056d2;
    font-weight:700;
    margin-right:8px;
    flex:0 0 auto;
  }

  .enrolled-line{
    font-size:15px;
    color:#1f1f1f;
  }
  .enrolled-line b{
    font-weight:700;
  }
</style>
</head>
<body>
  <div class="stage">
    <img class="bg" src="../assets/shots/course-page.png">

    <div class="cover">
      <div class="cta-btn">Create an account to see<br>enrollment options</div>
      <div class="perks">
        <div class="perk"><span class="check">&#10003;</span><span>Free to audit: watch all lectures and readings at no cost</span></div>
        <div class="perk"><span class="check">&#10003;</span><span>Certificate: $49 a month after a 7-day free trial, cancel anytime</span></div>
        <div class="perk"><span class="check">&#10003;</span><span>Financial aid available</span></div>
      </div>
      <div class="enrolled-line"><b>3,808,772</b> already enrolled</div>
    </div>
  </div>
</body>
</html>
